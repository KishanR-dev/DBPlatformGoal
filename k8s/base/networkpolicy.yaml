apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servicepulse-netpol
  namespace: servicepulse
  labels:
    app.kubernetes.io/name: servicepulse
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: servicepulse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic to container port 8000 from within the cluster
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution queries to CoreDNS in kube-system
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to internal cluster services if needed
    - to:
        - namespaceSelector: {}
