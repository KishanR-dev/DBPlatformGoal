apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: servicepulse
  namespace: servicepulse
  labels:
    app.kubernetes.io/name: servicepulse
    app.kubernetes.io/component: backend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: servicepulse
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - servicepulse