# ==============================================================================
# DBPlatformGoal — GitLab CI/CD Pipeline
# ==============================================================================
# Runner strategy: Self-hosted shell executor (WSL2 / Linux).
# The shell executor runs jobs natively on the host. Python-dependent stages
# use ephemeral Docker containers to maintain Python 3.12 target version.
# ==============================================================================

stages:
  - validate
  - test
  - security
  - build
  - package
  - deploy
  - verify

variables:
  PYTHON_VERSION: "3.12"
  IMAGE_REPOSITORY: "dbplatform/servicepulse"
  KUBE_NAMESPACE: "servicepulse"
  HELM_RELEASE: "servicepulse"

# Shell executor — no default image or tags required.
# The runner is registered to this project and picks up untagged jobs.

lint:bash:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/mnt" koalaman/shellcheck:stable /mnt/scripts/ci/local-ci-exec.sh /mnt/scripts/ops/system-health.sh /mnt/scripts/ops/process-diagnostics.sh /mnt/scripts/ops/network-diagnostics.sh /mnt/scripts/ops/service-check.sh /mnt/scripts/ops/firewall-check.sh /mnt/scripts/ops/resource-diagnostics.sh /mnt/scripts/ops/incident-check.sh /mnt/scripts/ops/validate-scripts.sh

lint:python:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/builds/project" -w /builds/project python:${PYTHON_VERSION}-slim bash -c "pip install --no-cache-dir ruff==0.11.12 && cd src/servicepulse && ruff check app tests"

lint:helm:
  stage: validate
  script:
    - helm lint charts/servicepulse
    - helm template servicepulse charts/servicepulse -f charts/servicepulse/values-dev.yaml > /dev/null

test:unit:
  stage: test
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/builds/project" -w /builds/project python:${PYTHON_VERSION}-slim bash -c "cd src/servicepulse && pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt && pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=85"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/servicepulse/coverage.xml

security:bandit:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/builds/project" -w /builds/project python:${PYTHON_VERSION}-slim bash -c "pip install --no-cache-dir bandit==1.9.4 && cd src/servicepulse && bandit -r app -ll"
  allow_failure: false

security:helm-lint:
  stage: security
  script:
    - helm lint charts/servicepulse
    - RENDERED=$(helm template servicepulse charts/servicepulse -f charts/servicepulse/values.yaml)
    - echo "$RENDERED" | grep -q 'runAsNonRoot' && echo "PASS runAsNonRoot present" || (echo "FAIL runAsNonRoot missing" && exit 1)
    - echo "$RENDERED" | grep -q 'allowPrivilegeEscalation' && echo "PASS allowPrivilegeEscalation present" || (echo "FAIL allowPrivilegeEscalation missing" && exit 1)
    - echo "$RENDERED" | grep -q 'readOnlyRootFilesystem' && echo "PASS readOnlyRootFilesystem present" || (echo "FAIL readOnlyRootFilesystem missing" && exit 1)
    - echo "$RENDERED" | grep -q 'RuntimeDefault' && echo "PASS seccompProfile RuntimeDefault present" || (echo "FAIL seccompProfile missing" && exit 1)
    - echo "$RENDERED" | grep -q 'automountServiceAccountToken' && echo "PASS automountServiceAccountToken present" || (echo "FAIL automountServiceAccountToken missing" && exit 1)
  allow_failure: false

security:pip-audit:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/builds/project" -w /builds/project python:${PYTHON_VERSION}-slim bash -c "pip install --no-cache-dir pip-audit==2.10.1 && pip-audit -r src/servicepulse/requirements.txt"
  allow_failure: false

security:manifest-check:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/builds/project" -w /builds/project python:${PYTHON_VERSION}-slim bash -c "pip install --no-cache-dir pyyaml && chmod +x /builds/project/scripts/ci/manifest-check.sh || true; python3 -c "import yaml, sys, glob; REQUIRED_POD_FIELDS={'runAsNonRoot': True}; WARNINGS=[]; [WARNINGS.append(f'{path}: podSecurityContext.{field}={sc.get(field)} (expected {expected})') for path in glob.glob('k8s/**/*.yaml', recursive=True) + glob.glob('charts/**/*.yaml', recursive=True) if 'secret.example' not in path and 'psa-test-privileged' not in path for doc in yaml.safe_load_all(open(path)) if doc and doc.get('kind') in ['Deployment', 'Pod', 'DaemonSet'] for spec in [doc.get('spec', {}) if doc.get('kind') != 'Pod' else doc.get('template', {}).get('spec', doc.get('spec', {}))] for sc in [spec.get('securityContext', {})] for field, expected in REQUIRED_POD_FIELDS.items() if sc.get(field) != expected]; print('\n'.join(['WARN: '+w for w in WARNINGS]))""
  allow_failure: true

build:container:
  stage: build
  script:
    - export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-$(git rev-parse --short HEAD)}
    - export IMAGE_TAG="git-${CI_COMMIT_SHORT_SHA}"
    - cd container/servicepulse
    - docker build -t ${IMAGE_REPOSITORY}:${IMAGE_TAG} -f Dockerfile ../../src/servicepulse
    - docker save ${IMAGE_REPOSITORY}:${IMAGE_TAG} > servicepulse-image.tar
  artifacts:
    paths:
      - container/servicepulse/servicepulse-image.tar
    expire_in: 1 hour

package:helm:
  stage: package
  script:
    - mkdir -p charts/dist
    - helm package charts/servicepulse -d charts/dist
  artifacts:
    paths:
      - charts/dist/*.tgz
    expire_in: 1 day

deploy:kind:
  stage: deploy
  script:
    - export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-$(git rev-parse --short HEAD)}
    - export IMAGE_TAG="git-${CI_COMMIT_SHORT_SHA}"
    - cd container/servicepulse
    - docker load -i servicepulse-image.tar
    - kind load docker-image ${IMAGE_REPOSITORY}:${IMAGE_TAG} --name db-platform
    - cd ../..
    - helm upgrade --install ${HELM_RELEASE} charts/servicepulse --namespace ${KUBE_NAMESPACE} --create-namespace -f charts/servicepulse/values-dev.yaml --set image.repository=${IMAGE_REPOSITORY} --set image.tag=${IMAGE_TAG}
  environment:
    name: development

verify:health:
  stage: verify
  script:
    - kubectl rollout status deployment/${HELM_RELEASE} -n ${KUBE_NAMESPACE} --timeout=120s
    - kubectl -n ${KUBE_NAMESPACE} run ci-smoke-test-health --image=curlimages/curl:latest --restart=Never --rm -i -- -s --fail http://${HELM_RELEASE}/health
    - kubectl -n ${KUBE_NAMESPACE} run ci-smoke-test-metrics --image=curlimages/curl:latest --restart=Never --rm -i -- -s --fail http://${HELM_RELEASE}/api/v1/metrics
