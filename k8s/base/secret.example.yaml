apiVersion: v1
kind: Secret
metadata:
  name: servicepulse-secret-example
  namespace: servicepulse
  labels:
    app.kubernetes.io/name: servicepulse
type: Opaque
stringData:
  # Reference placeholder: In SQLite mode, no secret is required (DATABASE_URL is set in ConfigMap).
  # If connecting to an external database (e.g. PostgreSQL), inject DATABASE_URL via this Secret.
  DATABASE_URL: "postgresql://appuser:EXAMPLE_PASSWORD_PLACEHOLDER@postgres.database.svc.cluster.local:5432/servicepulse"
