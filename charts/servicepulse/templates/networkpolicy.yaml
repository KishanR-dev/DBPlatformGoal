{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servicepulse.fullname" . }}-netpol
  labels:
    {{- include "servicepulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servicepulse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic to container port from within cluster
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ingressPort }}
  egress:
    {{- if .Values.networkPolicy.allowDnsEgress }}
    # Allow DNS resolution queries to CoreDNS in kube-system
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Allow internal cluster communication
    - to:
        - namespaceSelector: {}
{{- end }}
