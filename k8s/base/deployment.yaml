apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicepulse
  namespace: servicepulse
  labels:
    app.kubernetes.io/name: servicepulse
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: db-platform-portfolio
spec:
  # NOTE: replicas is intentionally set to 1.
  # ServicePulse currently operates in SQLite WAL mode. SQLite does not support multi-writer concurrent pod access.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: servicepulse
  template:
    metadata:
      labels:
        app: servicepulse
        app.kubernetes.io/name: servicepulse
        app.kubernetes.io/component: backend
    spec:
      # Pod-level security context enforcing non-root execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: servicepulse
          image: dbplatform/servicepulse:git-f549433
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Container-level security context enforcing filesystem immutability and capability dropping
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: servicepulse-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          # Sizing values: initial design estimates for development & local kind validation
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup probe: protects startup during schema creation before readiness checks
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          # Readiness probe: verifies pod can accept service traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          # Liveness probe: restarts container if application hangs or deadlocks
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # Writable volume mount for SQLite WAL database file
            - name: data-volume
              mountPath: /app/data
            # Writable memory-backed tmpfs for temporary files
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        # NOTE: emptyDir storage is tied to the pod lifecycle; database state is ephemeral across pod rescheduling.
        - name: data-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
