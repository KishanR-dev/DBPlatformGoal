# ==============================================================================
# DBPlatformGoal — GitLab CI/CD Pipeline
# ==============================================================================
# Runner strategy: Self-hosted shell executor (WSL2 / Linux).
# The shell executor runs natively on the host execution context, bypassing the 
# need for Docker-in-Docker limits. Because Docker Desktop operates outside the 
# WSL bound root, volume mounts are error prone. We utilize ephemeral builds.

stages:
  - validate
  - test
  - security
  - build
  - package
  - deploy
  - verify

variables:
  PYTHON_VERSION: "3.12"
  IMAGE_REPOSITORY: "dbplatform/servicepulse"
  KUBE_NAMESPACE: "servicepulse"
  HELM_RELEASE: "servicepulse"

# =============================================================================
# STAGE 1: VALIDATE
# =============================================================================
lint:bash:
  stage: validate
  script:
    - docker build -t gitlab-ci-shellcheck -f - . << 'DB'
FROM koalaman/shellcheck:stable
WORKDIR /app
COPY . .
ENTRYPOINT ["/bin/sh", "-c"]
CMD ["shellcheck scripts/ci/*.sh scripts/ops/*.sh"]
DB
    - docker run --rm gitlab-ci-shellcheck

lint:python:
  stage: validate
  script:
    - docker build -t gitlab-ci-python -f - . << 'DB'
FROM python:3.12-slim
WORKDIR /builds/project
COPY . .
RUN pip install --no-cache-dir ruff==0.11.12
CMD ["bash", "-c", "cd src/servicepulse && ruff check app tests"]
DB
    - docker run --rm gitlab-ci-python

lint:helm:
  stage: validate
  script:
    - helm lint charts/servicepulse
    - helm template servicepulse charts/servicepulse -f charts/servicepulse/values-dev.yaml > /dev/null

# =============================================================================
# STAGE 2: TEST
# =============================================================================
test:unit:
  stage: test
  script:
    - docker build -t gitlab-ci-pytest -f - . << 'DB'
FROM python:3.12-slim
WORKDIR /builds/project
COPY . .
RUN cd src/servicepulse && pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
CMD ["bash", "-c", "cd src/servicepulse && pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=85"]
DB
    - docker run --name pytest-runner gitlab-ci-pytest
    # Keep container to extract coverage artifact, then clean up
    - mkdir -p src/servicepulse
    - docker cp pytest-runner:/builds/project/src/servicepulse/coverage.xml src/servicepulse/coverage.xml || true
    - docker rm pytest-runner
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/servicepulse/coverage.xml

# =============================================================================
# STAGE 3: SECURITY
# =============================================================================
security:bandit:
  stage: security
  script:
    - docker build -t gitlab-ci-bandit -f - . << 'DB'
FROM python:3.12-slim
WORKDIR /builds/project
COPY . .
RUN pip install --no-cache-dir bandit==1.9.4
CMD ["bash", "-c", "cd src/servicepulse && bandit -r app -ll"]
DB
    - docker run --rm gitlab-ci-bandit
  allow_failure: false

security:helm-lint:
  stage: security
  script:
    - helm lint charts/servicepulse
    - RENDERED=$(helm template servicepulse charts/servicepulse -f charts/servicepulse/values.yaml)
    - echo "$RENDERED" | grep -q runAsNonRoot || exit 1
    - echo "$RENDERED" | grep -q allowPrivilegeEscalation || exit 1
    - echo "$RENDERED" | grep -q readOnlyRootFilesystem || exit 1
  allow_failure: false

security:pip-audit:
  stage: security
  script:
    - docker build -t gitlab-ci-pipaudit -f - . << 'DB'
FROM python:3.12-slim
WORKDIR /builds/project
COPY . .
RUN pip install --no-cache-dir pip-audit==2.10.1
CMD ["bash", "-c", "pip-audit -r src/servicepulse/requirements.txt"]
DB
    - docker run --rm gitlab-ci-pipaudit
  allow_failure: false

security:manifest-check:
  stage: security
  script:
    - docker build -t gitlab-ci-manifest -f - . << 'DB'
FROM python:3.12-slim
WORKDIR /builds/project
COPY . .
RUN pip install --no-cache-dir pyyaml
CMD ["python3", "scripts/ci/manifest-check.py"]
DB
    - docker run --rm gitlab-ci-manifest
  allow_failure: true

# =============================================================================
# STAGE 4: BUILD
# =============================================================================
build:container:
  stage: build
  script:
    - export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-$(git rev-parse --short HEAD)}
    - export IMAGE_TAG="git-${CI_COMMIT_SHORT_SHA}"
    - cd container/servicepulse
    - docker build -t ${IMAGE_REPOSITORY}:${IMAGE_TAG} -f Dockerfile ../../src/servicepulse
    - docker save ${IMAGE_REPOSITORY}:${IMAGE_TAG} > servicepulse-image.tar
  artifacts:
    paths:
      - container/servicepulse/servicepulse-image.tar
    expire_in: 1 hour

# =============================================================================
# STAGE 5: PACKAGE
# =============================================================================
package:helm:
  stage: package
  script:
    - mkdir -p charts/dist
    - helm package charts/servicepulse -d charts/dist
  artifacts:
    paths:
      - charts/dist/*.tgz
    expire_in: 1 day

# =============================================================================
# STAGE 6: DEPLOY
# =============================================================================
deploy:kind:
  stage: deploy
  script:
    - export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-$(git rev-parse --short HEAD)}
    - export IMAGE_TAG="git-${CI_COMMIT_SHORT_SHA}"
    - cd container/servicepulse
    - docker load -i servicepulse-image.tar
    - kind load docker-image ${IMAGE_REPOSITORY}:${IMAGE_TAG} --name db-platform
    - cd ../..
    - helm upgrade --install ${HELM_RELEASE} charts/servicepulse --namespace ${KUBE_NAMESPACE} --create-namespace -f charts/servicepulse/values-dev.yaml --set image.repository=${IMAGE_REPOSITORY} --set image.tag=${IMAGE_TAG}
  environment:
    name: development

# =============================================================================
# STAGE 7: VERIFY
# =============================================================================
verify:health:
  stage: verify
  script:
    - kubectl rollout status deployment/${HELM_RELEASE} -n ${KUBE_NAMESPACE} --timeout=120s
    - kubectl -n ${KUBE_NAMESPACE} run ci-smoke-test-health --image=curlimages/curl:latest --restart=Never --rm -i -- -s --fail http://${HELM_RELEASE}/health
    - kubectl -n ${KUBE_NAMESPACE} run ci-smoke-test-metrics --image=curlimages/curl:latest --restart=Never --rm -i -- -s --fail http://${HELM_RELEASE}/api/v1/metrics
